services:
  web:
    build: .
    ports: 
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      WEB_CONCURRENCY: "2"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    

  db:
    image: postgres:17
    networks:
      - database
    environment: 
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    image: postgres:17
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
    entrypoint: ["/bin/sh", "/usr/local/bin/gather-backup"]
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/gather-backup:ro
      - postgres_backups:/backups
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true

volumes:
  postgres_data:
  postgres_backups:

