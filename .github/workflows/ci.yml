name: python CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      FLASK_SECRET_KEY: ci-test-secret-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          python -m pytest
          node --check static/chat.js
          node tests/check_frontend.cjs

  build:
    runs-on: ubuntu-latest

    needs: test

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run : docker build -t python-ci-cd:v1 .

